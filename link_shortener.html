<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link Router — Self-hosted Redirect Engine</title>
<style>
  :root {
    --bg: #0B0E14;
    --grid: #141a26;
    --surface: #111621;
    --diagram-bg: #0E1219;
    --border: #1F2633;
    --node-idle: #131826;
    --node-ring: #2A3140;
    --text: #E8ECF1;
    --muted: #6B7686;
    --dim: #4A5568;
    --write: #FF6B35;
    --read: #3ECF8E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 36px 36px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 40px 16px;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 600; line-height: 1.3; margin: 0; }
  h1 .sub { color: var(--muted); font-weight: 400; }
  .stats { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .stats span { color: var(--text); }

  .input-row {
    display: flex; gap: 8px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 8px; padding: 8px;
  }
  .input-row.shake { animation: shakeX 0.4s ease; }
  .input-group { display: flex; align-items: center; gap: 8px; flex: 1; padding: 0 8px; }
  .input-group svg { flex-shrink: 0; }
  #urlInput {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14px; padding: 8px 0;
  }
  #urlInput::placeholder { color: var(--dim); }
  #shortenBtn {
    border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600;
    background: var(--write); color: var(--bg); cursor: pointer; transition: transform 0.1s ease, opacity 0.2s ease;
  }
  #shortenBtn:active { transform: scale(0.96); }
  #shortenBtn:disabled { opacity: 0.4; cursor: default; }
  .error-text { font-size: 12px; color: var(--write); margin-top: 8px; min-height: 16px; }

  .diagram-card {
    margin-top: 24px; border: 1px solid var(--border); background: var(--diagram-bg);
    border-radius: 8px; padding: 16px;
  }
  svg#diagram { width: 100%; display: block; }
  .status-text { text-align: center; font-size: 12px; margin-top: 4px; }

  .node-group { transform-box: fill-box; transform-origin: center; }
  .node-group.active { animation: nodePulse 0.6s ease; }

  .links-header { font-size: 12px; letter-spacing: 0.15em; color: var(--muted); margin: 32px 0 12px; }
  .empty-state {
    border: 1px dashed var(--border); border-radius: 8px; padding: 32px; text-align: center;
    font-size: 14px; color: var(--muted);
  }
  .loading-state { display: flex; align-items: center; gap: 8px; padding: 32px 0; color: var(--muted); font-size: 14px; }
  .spin { animation: spin 1s linear infinite; }

  .link-card {
    display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 8px; padding: 12px; margin-bottom: 8px;
    animation: cardIn 0.4s ease both; transition: opacity 0.2s ease;
  }
  .link-card.dimmed { opacity: 0.6; }
  .link-card.flash { animation: cardIn 0.4s ease both, glowFlash 0.9s ease; }
  .short-link {
    background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
    font-size: 14px; font-weight: 600; color: var(--text); padding: 0;
  }
  .short-link:disabled { cursor: default; }
  .short-link.busy { color: var(--read); }
  .dest {
    flex: 1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0;
  }
  .meta { font-size: 12px; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
  .icon-btn {
    background: none; border: none; cursor: pointer; padding: 6px; border-radius: 4px;
    flex-shrink: 0; display: flex; align-items: center; transition: background 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.05); }

  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes nodePulse { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes glowFlash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); } 100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .input-row.shake, .link-card, .node-group.active, .link-card.flash { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow mono">LINK ROUTER — SELF-HOSTED REDIRECT ENGINE</div>
        <h1>Every link takes a path.<br /><span class="sub">Watch it get there.</span></h1>
      </div>
      <div class="stats mono">
        <div>LINKS <span id="statLinks">0</span></div>
        <div>CLICKS <span id="statClicks">0</span></div>
      </div>
    </header>

    <div class="input-row" id="inputRow">
      <div class="input-group">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <input id="urlInput" class="mono" type="text" placeholder="Paste a long URL — example.com/very/long/path" />
      </div>
      <button id="shortenBtn" class="mono">SHORTEN</button>
    </div>
    <div class="error-text mono" id="errorText"></div>

    <div class="diagram-card">
      <svg id="diagram" viewBox="0 0 800 200">
        <path id="basePath" d="M70,100 C180,100 180,55 290,55 C400,55 400,145 510,145 C620,145 620,100 730,100"
          fill="none" stroke="#1C2230" stroke-width="2" />
        <path id="glowPath" d="M70,100 C180,100 180,55 290,55 C400,55 400,145 510,145 C620,145 620,100 730,100"
          fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0.5" style="display:none" />
        <g id="trailLayer"></g>
        <g id="nodesLayer"></g>
      </svg>
      <div class="status-text mono" id="statusText" style="color:#6B7686">READY</div>
    </div>

    <div class="links-header mono">YOUR LINKS</div>
    <div id="loadingState" class="loading-state mono" style="display:none">
      <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
      Loading your links…
    </div>
    <div id="emptyState" class="empty-state mono">No links routed yet. Paste one above to see it enter the system.</div>
    <div id="linksList"></div>
  </div>

<script>
(function () {
  "use strict";

  var NODES = [ {x:70,y:100}, {x:290,y:55}, {x:510,y:145}, {x:730,y:100} ];
  var BREAKS = [0, 0.33, 0.66, 0.98];
  var LABELS = {
    write: ["CLIENT", "HASH ENGINE", "KV STORE", "SHORT LINK"],
    read: ["CLIENT", "ROUTER", "KV STORE", "DESTINATION"]
  };
  var STATUS = {
    write: ["REQUEST RECEIVED", "GENERATING HASH", "WRITING RECORD", "LINK LIVE"],
    read: ["REQUEST RECEIVED", "MATCHING ROUTE", "LOOKING UP KEY", "302 REDIRECT"]
  };
  var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  var ACCENT = { write: "#FF6B35", read: "#3ECF8E" };
  var STORAGE_KEY = "link_router_links_v1";

  var links = [];
  var isAnimating = false;
  var currentMode = "write";
  var pendingLinkCode = null;

  var el = {
    urlInput: document.getElementById("urlInput"),
    shortenBtn: document.getElementById("shortenBtn"),
    inputRow: document.getElementById("inputRow"),
    errorText: document.getElementById("errorText"),
    statLinks: document.getElementById("statLinks"),
    statClicks: document.getElementById("statClicks"),
    statusText: document.getElementById("statusText"),
    basePath: document.getElementById("basePath"),
    glowPath: document.getElementById("glowPath"),
    trailLayer: document.getElementById("trailLayer"),
    nodesLayer: document.getElementById("nodesLayer"),
    linksList: document.getElementById("linksList"),
    emptyState: document.getElementById("emptyState"),
    loadingState: document.getElementById("loadingState")
  };

  function svgEl(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function timeAgo(ts) {
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 5) return "just now";
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }

  function validateUrl(raw) {
    var str = (raw || "").trim();
    if (!str) return null;
    try {
      var withScheme = /^https?:\/\//i.test(str) ? str : "https://" + str;
      var u = new URL(withScheme);
      if (u.hostname.indexOf(".") === -1) return null;
      u.pathname = u.pathname.replace(/\.html?$/i, "");
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function genCode(existingSet) {
    var code;
    do {
      code = "";
      for (var i = 0; i < 6; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    } while (existingSet.has(code));
    return code;
  }

  function loadLinks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      links = raw ? JSON.parse(raw) : [];
    } catch (e) {
      links = [];
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
    } catch (e) {
      // storage unavailable — continue silently
    }
  }

  function renderStats() {
    el.statLinks.textContent = links.length;
    var totalClicks = links.reduce(function (sum, l) { return sum + l.clicks; }, 0);
    el.statClicks.textContent = totalClicks;
  }

  function animateNumber(node, from, to) {
    if (from === to) { node.textContent = to; return; }
    var start = performance.now();
    var dur = 500;
    function tick(now) {
      var t = Math.min(1, (now - start) / dur);
      node.textContent = Math.round(from + (to - from) * easeInOutCubic(t));
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderNodes(mode, activeIdx) {
    el.nodesLayer.innerHTML = "";
    var accent = ACCENT[mode];
    NODES.forEach(function (n, i) {
      var active = i === activeIdx;
      var g = svgEl("g", { class: "node-group" + (active ? " active" : "") });
      var outer = svgEl("circle", {
        cx: n.x, cy: n.y, r: 16,
        fill: active ? accent : "#131826",
        stroke: active ? accent : "#2A3140",
        "stroke-width": 2
      });
      var inner = svgEl("circle", { cx: n.x, cy: n.y, r: 5, fill: active ? "#0B0E14" : "#4A5568" });
      var label = svgEl("text", {
        x: n.x, y: n.y + (i % 2 === 0 ? 34 : -26),
        "text-anchor": "middle", class: "mono", "font-size": 10,
        fill: active ? "#E8ECF1" : "#4A5568", "letter-spacing": 0.5
      });
      label.textContent = LABELS[mode][i];
      g.appendChild(outer); g.appendChild(inner); g.appendChild(label);
      el.nodesLayer.appendChild(g);
    });
  }

  function runAnimation(mode, onDone) {
    currentMode = mode;
    isAnimating = true;
    var accent = ACCENT[mode];
    el.glowPath.style.display = "block";
    el.glowPath.setAttribute("stroke", accent);
    el.statusText.style.color = accent;
    el.statusText.textContent = STATUS[mode][0];
    renderNodes(mode, 0);

    var total = el.basePath.getTotalLength();
    var duration = 1400;
    var start = performance.now();
    var trailPoints = [];

    function frame(now) {
      var raw = Math.min(1, (now - start) / duration);
      var eased = easeInOutCubic(raw);

      el.glowPath.setAttribute("stroke-dashoffset", 1000 - eased * 1000);

      var idx = 0;
      for (var i = BREAKS.length - 1; i >= 0; i--) {
        if (eased >= BREAKS[i]) { idx = i; break; }
      }
      renderNodes(mode, idx);
      el.statusText.textContent = STATUS[mode][idx];

      var pt = el.basePath.getPointAtLength(eased * total);
      trailPoints.push({ x: pt.x, y: pt.y });
      if (trailPoints.length > 9) trailPoints.shift();

      el.trailLayer.innerHTML = "";
      trailPoints.forEach(function (p, i) {
        var frac = i / trailPoints.length;
        el.trailLayer.appendChild(svgEl("circle", {
          cx: p.x, cy: p.y, r: 2 + frac * 4, fill: accent, opacity: frac * 0.5
        }));
      });
      var head = trailPoints[trailPoints.length - 1];
      if (head) {
        el.trailLayer.appendChild(svgEl("circle", { cx: head.x, cy: head.y, r: 6, fill: accent }));
      }

      if (raw < 1) {
        requestAnimationFrame(frame);
      } else {
        renderNodes(mode, 3);
        el.statusText.textContent = STATUS[mode][3];
        setTimeout(function () {
          isAnimating = false;
          el.glowPath.style.display = "none";
          el.trailLayer.innerHTML = "";
          renderNodes(mode, -1);
          el.statusText.textContent = "READY";
          el.statusText.style.color = "#6B7686";
          if (onDone) onDone();
        }, 350);
      }
    }
    requestAnimationFrame(frame);
  }

  function handleShorten() {
    if (isAnimating) return;
    var clean = validateUrl(el.urlInput.value);
    if (!clean) {
      el.errorText.textContent = "That doesn't look like a valid URL. Try something like example.com/path";
      el.inputRow.classList.remove("shake");
      void el.inputRow.offsetWidth;
      el.inputRow.classList.add("shake");
      return;
    }
    el.errorText.textContent = "";
    updateShortenBtn();
    runAnimation("write", function () {
      var existing = new Set(links.map(function (l) { return l.code; }));
      var code = genCode(existing);
      links.unshift({ code: code, longUrl: clean, createdAt: Date.now(), clicks: 0 });
      persist();
      el.urlInput.value = "";
      render(code);
      updateShortenBtn();
    });
    updateShortenBtn();
  }

  function handleOpen(code) {
    if (isAnimating) return;
    var link = links.find(function (l) { return l.code === code; });
    if (!link) return;
    pendingLinkCode = code;
    render();
    runAnimation("read", function () {
      link.clicks += 1;
      link.lastClicked = Date.now();
      persist();
      pendingLinkCode = null;
      render();
      window.open(link.longUrl, "_blank", "noopener,noreferrer");
    });
  }

  function handleDelete(code) {
    links = links.filter(function (l) { return l.code !== code; });
    persist();
    render();
  }

  function handleCopy(code, btn) {
    var short = "lnk.rt/" + code;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(short).catch(function () {});
    }
    btn.innerHTML = checkIcon();
    setTimeout(function () { btn.innerHTML = copyIcon(); }, 1400);
  }

  function copyIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
  }
  function checkIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }
  function trashIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  }
  function externalIcon() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
  }

  function updateShortenBtn() {
    el.shortenBtn.disabled = isAnimating || !el.urlInput.value.trim();
    el.shortenBtn.textContent = isAnimating && currentMode === "write" ? "ROUTING…" : "SHORTEN";
  }

  function render(justAddedCode) {
    renderStats();
    el.linksList.innerHTML = "";
    el.emptyState.style.display = links.length === 0 ? "block" : "none";

    links.forEach(function (l) {
      var busy = isAnimating && pendingLinkCode === l.code;
      var card = document.createElement("div");
      card.className = "link-card" + (isAnimating && !busy ? " dimmed" : "") + (justAddedCode === l.code ? " flash" : "");

      var shortBtn = document.createElement("button");
      shortBtn.className = "short-link mono" + (busy ? " busy" : "");
      shortBtn.disabled = isAnimating;
      shortBtn.title = "Open (resolves through the router)";
      shortBtn.innerHTML = "lnk.rt/" + l.code + " " + externalIcon();
      shortBtn.addEventListener("click", function () { handleOpen(l.code); });

      var dest = document.createElement("div");
      dest.className = "dest mono";
      dest.title = l.longUrl;
      dest.textContent = "→ " + l.longUrl;

      var meta = document.createElement("div");
      meta.className = "meta mono";
      var clickSpan = document.createElement("span");
      var oldClicks = parseInt(clickSpan.dataset.val || "0", 10);
      meta.appendChild(clickSpan);
      meta.appendChild(document.createTextNode(" clicks · " + timeAgo(l.createdAt)));
      clickSpan.textContent = l.clicks;

      var copyBtn = document.createElement("button");
      copyBtn.className = "icon-btn";
      copyBtn.title = "Copy short link";
      copyBtn.innerHTML = copyIcon();
      copyBtn.addEventListener("click", function () { handleCopy(l.code, copyBtn); });

      var delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.title = "Delete";
      delBtn.innerHTML = trashIcon();
      delBtn.addEventListener("click", function () { handleDelete(l.code); });

      card.appendChild(shortBtn);
      card.appendChild(dest);
      card.appendChild(meta);
      card.appendChild(copyBtn);
      card.appendChild(delBtn);
      el.linksList.appendChild(card);
    });

    updateShortenBtn();
  }

  el.shortenBtn.addEventListener("click", handleShorten);
  el.urlInput.addEventListener("input", function () {
    if (el.errorText.textContent) el.errorText.textContent = "";
    updateShortenBtn();
  });
  el.urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") handleShorten();
  });

  loadLinks();
  renderNodes("write", -1);
  render();
})();
</script>
</body>
</html>
