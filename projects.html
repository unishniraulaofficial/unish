<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unish Niraula — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #15181d;
    --border: #262b33;
    --text: #d5d9de;
    --dim: #7c8390;
    --amber: #e3b341;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  
  .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  
  header { position: sticky; top: 0; z-index: 50; background: rgba(13,15,18,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .header-row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; max-width: 720px; margin: 0 auto; }
  .avatar-sm { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--amber); flex-shrink: 0; }
  .avatar-sm img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .header-name { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .header-role { font-family: var(--mono); font-size: 12px; color: var(--amber); }

  .nav-box { display: flex; background: #111317; border: 1px solid var(--border); border-radius: 8px; margin: 20px 0 30px; overflow: hidden; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 10px; color: var(--dim); font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; border-right: 1px solid rgba(255,255,255,.05); user-select: none; }
  .nav-item:last-child { border-right: none; }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 6px; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,.02); }
  .nav-item.active { color: var(--amber); background: rgba(227,179,65,.03); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 14px; }
  .empty-tab { text-align: center; padding: 60px 20px; color: var(--dim); font-family: var(--mono); font-size: 14px; }

  footer { text-align: center; padding: 40px 20px 20px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="avatar-sm"><img src="https://cdn.phototourl.com/free/2026-08-13-e6fae289-1e49-4fce-b732-136059cf0826.png" alt="Unish"></div>
    <div>
      <div class="header-name">Unish Niraula</div>
      <div class="header-role">Aspiring Full Stack Dev</div>
    </div>
  </div>
</header>

<main class="container">
  <nav class="nav-box">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>HOME
    </a>
    <div class="nav-item active" onclick="switchTab('projects',this)">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>PROJECTS
    </div>
    <div class="nav-item" onclick="switchTab('contact',this)">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>CONTACT
    </div>
  </nav>

  <div id="projects" class="tab-content active">
    <div class="card empty-tab">
      <p>Projects section coming soon...</p>
    </div>
  </div>

  <div id="contact" class="tab-content">
    <div class="card empty-tab"><p>Contact section coming soon...</p></div>
  </div>
</main>

<footer>&copy; <span id="year"></span> Unish Niraula. All rights reserved.</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  function switchTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (el) el.classList.add('active');
  }
</script>
</body>
</html>
